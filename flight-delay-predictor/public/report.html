<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a1330">
<link rel="manifest" href="manifest.json">
<meta name="description" content="FlightPredict: know before you go. Estimate flight delay risk from weather, traffic, wind and inbound delays.">
<title>Prediction report · FlightPredict</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme-init.js"></script>
</head>
<body data-page="predict">
<main id="main" class="page">
<div class="page-head"><h1>Prediction report</h1><p>A printable summary of your latest prediction.</p></div>
<div id="noData" class="card" hidden><div class="empty"><h3>No prediction yet</h3><p>Make a prediction first and the report will appear here.</p><a class="btn btn-primary" href="predict.html">Predict a flight</a></div></div>
<div id="reportBody" hidden>
  <div class="grid cols-2" style="align-items:start">
    <section class="card" aria-labelledby="sh">
      <div class="card-head"><div><h2 id="sh">Summary</h2><p id="stamp"></p></div></div>
      <div id="repResult"></div>
    </section>
    <section class="card" aria-labelledby="dh">
      <div class="card-head"><h2 id="dh">Flight details</h2></div>
      <div class="kv" id="kv"></div>
      <h3 class="section-title">Analysis</h3>
      <p id="analysis" class="prose"></p>
      <div class="btn-row no-print">
        <button type="button" class="btn btn-primary" id="printBtn">Save as PDF / print</button>
        <button type="button" class="btn btn-ghost" id="csvBtn">Download CSV</button>
        <button type="button" class="btn btn-ghost" id="copyBtn">Copy summary</button>
      </div>
      <div class="btn-row no-print" style="margin-top:12px"><a class="btn btn-ghost" href="predict.html">← Back to predictor</a></div>
    </section>
  </div>
</div>

</main>
<noscript><p style="padding:16px">FlightPredict needs JavaScript for navigation and charts.</p></noscript>
<script src="shell.js"></script>
<script src="charts.js"></script>
<script src="report.js"></script>
</body>
</html>
