<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FlightPredict logo">
  <defs>
    <linearGradient id="fp-g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#3b6cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0a1330"/>
  <!-- open ring: reads as a risk gauge -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1c2a55" stroke-width="4"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#fp-g)" stroke-width="4" stroke-linecap="round"
