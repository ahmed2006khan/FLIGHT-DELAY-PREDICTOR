<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="FlightPredict: know before you go. Estimate flight delay risk from weather, traffic, wind and inbound delays.">
<title>History · FlightPredict</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme-init.js"></script>
</head>
<body data-page="history">
<main id="main" class="page">
<div class="page-head"><h1>Prediction history</h1><p>Every saved prediction, with search, filters and CSV export.</p></div>
<div id="storageNote" class="alert" data-tone="info" role="status" hidden></div>
<section class="card" aria-labelledby="hh">
  <h2 id="hh" class="sr-only">Saved predictions</h2>
  <div class="grid cols-4" style="margin-bottom:20px" id="hStats"></div>
  <div class="toolbar">
    <div class="field grow"><label for="q">Search</label><input id="q" type="search" placeholder="Flight, airline or airport"></div>
    <div class="field"><label for="fRisk">Risk</label><select id="fRisk"><option value="">All</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
    <div class="field"><label for="fWeather">Weather</label><select id="fWeather"><option value="">All</option><option>clear</option><option>cloudy</option><option>rain</option><option>fog</option><option>storm</option></select></div>
    <button type="button" class="btn btn-ghost" id="csvBtn">Download CSV</button>
  </div>
  <div class="table-wrap"><table><caption id="count"></caption>
    <thead><tr><th scope="col">Flight</th><th scope="col">Route</th><th scope="col">Departs</th><th scope="col">Weather</th><th scope="col">Traffic</th><th scope="col">Delay</th><th scope="col">Chance</th><th scope="col">Risk</th></tr></thead>
    <tbody id="rows"></tbody></table></div>
  <div class="note" id="note">Loading…</div>
</section>

</main>
<noscript><p style="padding:16px">FlightPredict needs JavaScript for navigation and charts.</p></noscript>
<script src="shell.js"></script>
<script src="history.js"></script>
</body>
</html>
