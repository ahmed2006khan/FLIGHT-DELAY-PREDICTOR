services:
  - type: web
    name: flight-delay-predictor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flight-delay-db
          property: connectionString

databases:
  - name: flight-delay-db
    plan: free
    databaseName: flightdb
    user: flightuser
